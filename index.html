      :root {
        --chat--color-primary: #6D28D9;

  <body>
    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="img-sharpen" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feConvolveMatrix order="3" kernelMatrix="0 -1 0 -1 5 -1 0 -1 0" preserveAlpha="true" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>

    <script type="module">
      import { createChat } from "https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js";

      // Clear saved chat session so every page load starts completely fresh
      try {
        Object.keys(localStorage).forEach(function(k) {
          if (k.toLowerCase().includes('n8n') || k.toLowerCase().includes('chat')) {
            localStorage.removeItem(k);
          }
        });
      } catch(e) {}

      createChat({
        webhookUrl: "https://n8n.srv1512353.hstgr.cloud/webhook/e1798891-dcb2-4ba3-817e-2c0e12dc8869/chat",
        loadPreviousSession: false,
        initialMessages: [
          "Hey there! I'm Maya, your personal support guide for The Budget Nista family!",
          "Whether you have questions about the Reset Challenge, need help with your enrollment emails, or want to learn more about Tiffany's programs — I've got you covered!",
          "How can I help you today?"
        ],
        i18n: {
          en: {
            title: "Chat with Maya",
            subtitle: "Reset Challenge Support • The Budget Nista",
            inputPlaceholder: "Type your message...",
            getStarted: "New Conversation",
            closeButtonTooltip: "Close chat"
          }
        }
      });
    </script>

    <script>
      var suggestionsInjected = false;

      var injectInterval = setInterval(function () {
        if (suggestionsInjected) { clearInterval(injectInterval); return; }

        var input =
          document.querySelector('textarea[placeholder="Type your message..."]') ||
          document.querySelector('input[placeholder="Type your message..."]');

        if (!input || input.offsetWidth === 0) return;

        var inputRow   = input.parentNode;
        var inputBlock = inputRow && inputRow.parentNode;
        var chatBody   = inputBlock && inputBlock.parentNode;

        if (!chatBody || !inputBlock) return;

        suggestionsInjected = true;
        clearInterval(injectInterval);

        var container = document.createElement('div');
        container.id = 'maya-suggestions-injected';
        container.style.cssText = [
          'padding: 10px 14px',
          'display: flex',
          'flex-direction: column',
          'gap: 8px',
          'background: #faf5ff',
          'border-top: 1px solid #ede9fe',
        ].join(';');

        var questions = [
          'Tell me about the Reset Challenge',
          'I did not get my enrollment emails',
          'What other programs does Tiffany offer?'
        ];

        questions.forEach(function (text) {
          var btn = document.createElement('button');
          btn.textContent = text;
          btn.style.cssText = [
            'background: #ffffff',
            'border: 1.5px solid #6D28D9',
            'color: #6D28D9',
            'padding: 9px 16px',
            'border-radius: 20px',
            'font-size: 13px',
            'font-weight: 500',
            'cursor: pointer',
            'text-align: left',
            'width: 100%',
            'font-family: inherit',
            'transition: background 0.18s, color 0.18s',
          ].join(';');

          btn.addEventListener('mouseover', function () {
            this.style.background = '#6D28D9';
            this.style.color = '#ffffff';
          });
          btn.addEventListener('mouseout', function () {
            this.style.background = '#ffffff';
            this.style.color = '#6D28D9';
          });
          btn.addEventListener('click', function () {
            container.remove();
            sendToMaya(text);
          });
          container.appendChild(btn);
        });

        chatBody.insertBefore(container, inputBlock);
      }, 400);


      function sendToMaya(text) {
        var attempts = 0;
        var interval = setInterval(function () {
          attempts++;
          if (attempts > 40) { clearInterval(interval); return; }

          var input =
            document.querySelector('textarea[placeholder="Type your message..."]') ||
            document.querySelector('input[placeholder="Type your message..."]') ||
            document.querySelector('textarea');

          if (!input) return;
          clearInterval(interval);

          input.focus();
          if (input.select) input.select();

          var ok = document.execCommand('insertText', false, text);

          if (!ok || input.value !== text) {
            var proto = Object.getPrototypeOf(input);
            var descriptor = Object.getOwnPropertyDescriptor(proto, 'value');
            if (descriptor && descriptor.set) {
              descriptor.set.call(input, text);
            } else {
              input.value = text;
            }
            input.dispatchEvent(new InputEvent('input', { bubbles: true, cancelable: true, data: text }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
          }

          setTimeout(function () {
            var form = input.closest('form');
            var btn = form
              ? (form.querySelector('button[type="submit"]') || form.querySelector('button'))
              : (document.querySelector('button[type="submit"]') ||
                 document.querySelector('[class*="send"]'));

            if (btn && !btn.disabled) {
              btn.click();
            } else {
              ['keydown', 'keypress', 'keyup'].forEach(function (evtType) {
                input.dispatchEvent(new KeyboardEvent(evtType, {
                  key: 'Enter', code: 'Enter', keyCode: 13,
                  which: 13, bubbles: true, cancelable: true
                }));
              });
            }
          }, 150);
        }, 250);
      }
    </script>
  </body>
